<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Stats System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#060810;
  --border2:rgba(80,110,200,.18);
  --text:#e4eeff;
  --muted:#6a82b0;
  --muted2:#3d5280;
  --blue:#5584ff;
  --cyan:#38bdf8;
  --pink:#ff4db8;
  --red:#ff3d5c;
  --r:12px;
  --ease:cubic-bezier(.25,.46,.45,.94);
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Outfit',sans-serif;
  background:#060810;
  color:var(--text);
}

body{
  opacity:1;
  background:linear-gradient(180deg,#050711,#070b16 55%,#04050b);
}

body.z-leaving{
  opacity:0;
  transition:opacity .25s ease;
}

.bg-grid{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.bg-grid::before{
  content:"";
  position:absolute;
  inset:auto -18% -8% -18%;
  height:56%;
  background:
    linear-gradient(rgba(85,132,255,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(85,132,255,.08) 1px,transparent 1px);
  background-size:76px 76px;
  transform:perspective(760px) rotateX(62deg);
  transform-origin:bottom;
  opacity:.34;
  animation:gridMove 22s linear infinite;
}

.bg-grid::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(115deg,transparent 0%,rgba(85,132,255,.045) 42%,transparent 72%),
    radial-gradient(ellipse 70% 38% at 50% 22%,rgba(85,132,255,.11),transparent 62%),
    radial-gradient(ellipse 55% 34% at 50% 92%,rgba(56,189,248,.07),transparent 68%);
  opacity:.85;
}

.net{
  position:fixed;
  left:8%;
  right:8%;
  top:51%;
  height:92px;
  opacity:.28;
  border-top:1px solid rgba(85,132,255,.55);
  border-bottom:1px solid rgba(85,132,255,.18);
  background:
    linear-gradient(90deg,rgba(85,132,255,.22) 1px,transparent 1px),
    linear-gradient(rgba(85,132,255,.16) 1px,transparent 1px);
  background-size:48px 23px;
  transform:skewY(-2deg);
  mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);
  pointer-events:none;
}

.court-lines{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.33;
}

.court-lines::before{
  content:"";
  position:absolute;
  left:9%;
  right:9%;
  bottom:9%;
  height:32%;
  border:1px solid rgba(85,132,255,.18);
  border-radius:50% 50% 0 0 / 22% 22% 0 0;
  transform:perspective(700px) rotateX(58deg);
  box-shadow:inset 0 0 35px rgba(85,132,255,.06),0 0 40px rgba(85,132,255,.08);
}

.court-lines::after{
  content:"";
  position:absolute;
  left:18%;
  right:18%;
  bottom:20%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(56,189,248,.5),transparent);
  box-shadow:0 0 22px rgba(56,189,248,.25);
}

.streaks{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.24;
  background:
    linear-gradient(115deg,transparent 12%,rgba(85,132,255,.12) 13%,transparent 14%),
    linear-gradient(115deg,transparent 48%,rgba(56,189,248,.08) 49%,transparent 50%),
    linear-gradient(115deg,transparent 78%,rgba(255,77,184,.06) 79%,transparent 80%);
  background-size:420px 420px;
}

@keyframes gridMove{
  from{background-position:0 0}
  to{background-position:76px 76px}
}

.screen{
  position:relative;
  z-index:2;
  min-height:100%;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:34px 46px 28px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.vball-small{
  width:46px;
  height:46px;
  filter:drop-shadow(0 0 10px rgba(56,189,248,.30));
  transition:transform .28s var(--ease),filter .28s var(--ease);
}

.vball-small:hover{
  transform:rotate(16deg) scale(1.06);
  filter:drop-shadow(0 0 14px rgba(56,189,248,.50));
}

.vball-main{
  width:112px;
  height:112px;
  margin:0 auto 22px;
  filter:drop-shadow(0 0 18px rgba(56,189,248,.34));
  transition:transform .32s var(--ease),filter .28s var(--ease);
}

.vball-main:hover{
  transform:rotate(18deg) translateY(-3px) scale(1.04);
  filter:drop-shadow(0 0 24px rgba(56,189,248,.52));
}

.brand-text{
  display:grid;
  gap:3px;
}

.brand-text b{
  font-family:'Bebas Neue',sans-serif;
  font-size:32px;
  letter-spacing:2px;
  line-height:1;
}

.brand-text small{
  font-family:'DM Mono',monospace;
  color:var(--blue);
  font-size:11px;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.top-actions{
  display:flex;
  gap:10px;
  align-items:center;
}

.update-btn{
  height:38px;
  padding:0 15px;
  border-radius:10px;
  border:1px solid var(--border2);
  background:rgba(85,132,255,.06);
  color:var(--blue);
  font-family:'DM Mono',monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:.8px;
  cursor:pointer;
}

.update-btn:hover{
  border-color:rgba(85,132,255,.55);
  background:rgba(85,132,255,.14);
}

.version{
  font-family:'DM Mono',monospace;
  font-size:12px;
  color:var(--muted2);
}

.hero{
  display:grid;
  place-items:center;
  text-align:center;
}

.hero-card{
  width:min(820px,92vw);
  border:1px solid var(--border2);
  border-radius:28px;
  background:
    linear-gradient(180deg,rgba(15,20,36,.70),rgba(6,8,16,.48)),
    radial-gradient(circle at 50% 0%,rgba(85,132,255,.12),transparent 58%);
  box-shadow:0 0 70px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.035);
  padding:38px 44px 38px;
  backdrop-filter:blur(8px);
}

.title{
  font-family:'Bebas Neue',sans-serif;
  font-size:82px;
  letter-spacing:5px;
  line-height:.9;
  color:#f4f8ff;
  text-shadow:0 0 12px rgba(85,132,255,.50),0 0 24px rgba(56,189,248,.16);
}

.subtitle{
  margin-top:8px;
  font-family:'DM Mono',monospace;
  font-size:18px;
  letter-spacing:9px;
  color:var(--cyan);
  text-transform:uppercase;
}

.desc{
  margin:26px auto 0;
  max-width:570px;
  color:var(--muted);
  font-size:15px;
  line-height:1.6;
}

.lang-title{
  margin-top:34px;
  font-family:'DM Mono',monospace;
  color:var(--blue);
  font-size:12px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
}

.lang-box{
  margin-top:14px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.lang-btn{
  height:58px;
  border-radius:var(--r);
  border:1px solid var(--border2);
  background:rgba(8,12,26,.72);
  color:var(--text);
  font-family:'DM Mono',monospace;
  font-size:13px;
  font-weight:700;
  letter-spacing:1px;
  cursor:pointer;
  transition:.22s var(--ease);
}

.lang-btn:hover{
  transform:translateY(-2px);
  border-color:rgba(85,132,255,.7);
  background:rgba(85,132,255,.12);
  box-shadow:0 0 24px rgba(85,132,255,.16);
}

.tip{
  margin:28px auto 0;
  max-width:560px;
  border:1px solid var(--border2);
  border-radius:var(--r);
  background:rgba(4,6,14,.42);
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
}

.tip-icon{
  width:38px;
  height:38px;
  border-radius:10px;
  border:1px solid rgba(85,132,255,.18);
  background:rgba(85,132,255,.08);
  display:grid;
  place-items:center;
  color:var(--cyan);
  font-size:18px;
  font-weight:800;
}

.tip b{
  display:block;
  font-family:'DM Mono',monospace;
  font-size:12px;
  color:var(--cyan);
  margin-bottom:4px;
  letter-spacing:1px;
}

.tip span{
  font-size:13px;
  color:var(--muted);
}

.footer{
  position:relative;
  display:grid;
  place-items:center;
  font-family:'DM Mono',monospace;
  font-size:12px;
  color:var(--muted2);
  min-height:24px;
}

.credits{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  text-align:center;
}

.credits .name{
  color:var(--cyan);
  text-shadow:0 0 10px rgba(56,189,248,.55);
}

.credits .name2{
  color:var(--pink);
  text-shadow:0 0 10px rgba(255,77,184,.55);
}

.loading-line{
  position:absolute;
  right:0;
  bottom:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:var(--blue);
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--blue);
  opacity:.35;
  animation:dots 1.25s ease-in-out infinite;
}

.dot:nth-child(2){animation-delay:.18s}
.dot:nth-child(3){animation-delay:.36s}

@keyframes dots{
  0%,100%{opacity:.25;transform:scale(1)}
  50%{opacity:1;transform:scale(1.35)}
}

.update-modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  place-items:center;
  background:rgba(2,4,10,.72);
  backdrop-filter:blur(8px);
  padding:22px;
}

.update-modal.show{
  display:grid;
}

.update-card{
  width:min(720px,
              width:min(720px,94vw);
  max-height:82vh;
  overflow:auto;
  border:1px solid rgba(85,132,255,.28);
  border-radius:22px;
  background:
    linear-gradient(170deg,rgba(18,25,48,.98),rgba(6,8,18,.98)),
    radial-gradient(circle at 50% 0%,rgba(85,132,255,.18),transparent 55%);
  box-shadow:0 30px 90px rgba(0,0,0,.65);
  padding:24px;
}

.update-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.close-btn{
  background:none;
  border:none;
  font-size:22px;
  color:#ff9bad;
  cursor:pointer;
}

.log-section{
  display:grid;
  gap:12px;
}

.log-block{
  border-left:3px solid var(--blue);
  padding-left:10px;
}

.log-sub{
  display:block;
  font-size:13px;
  color:var(--muted2);
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="net"></div>
<div class="court-lines"></div>
<div class="streaks"></div>

<div class="screen">

<header class="topbar">
  <div class="brand">
    <svg class="vball-small" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="50" fill="#3ba7ff"/>
    </svg>

    <div class="brand-text">
      <b>PLAYER STATS SYSTEM</b>
      <small>Match analytics interface</small>
    </div>
  </div>

  <div class="top-actions">
    <button class="update-btn" onclick="openUpdateLog()">UPDATE LOG</button>
    <div class="version">VERSÃO 1.0.2</div>
  </div>
</header>

<main class="hero">
  <section class="hero-card">

    <svg class="vball-main" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="50" fill="#3ba7ff"/>
    </svg>

    <h1 class="title">PLAYER STATS</h1>
    <div class="subtitle">SYSTEM</div>

    <p class="desc">Escolha o idioma para iniciar o sistema.</p>

    <div class="lang-box">
      <button class="lang-btn" onclick="goTo('Stats.html')">ENGLISH</button>
      <button class="lang-btn" onclick="goTo('message.html')">PORTUGUÊS</button>
      <button class="lang-btn" onclick="goTo('Estadisticas.html')">ESPAÑOL</button>
    </div>

  </section>
</main>

<footer class="footer">
  <div class="credits">
    Made By <span class="name">ZENOIR</span> & <span class="name2">Fuas</span>
  </div>

  <div class="loading-line">
    PREPARANDO INTERFACE
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
</footer>
</div>
<div class="update-modal" id="updateModal">
  <div class="update-card">

    <div class="update-head">
      <h2 id="logTitle">UPDATE LOG</h2>
      <button class="close-btn" onclick="closeUpdateLog()">×</button>
    </div>

    <div id="logContent"></div>

  </div>
</div>
<script>
const UPDATE_LOG_VERSION = "1.0.2";

const UPDATE_LOG_PT = [
  {
    title: "TESTE LOG",
    items: [
      ["TESTELOG2", "TESTELOG2"]
    ]
  },
  {
    title: "INTERFACE",
    items: [
      ["Nova tela inicial", "Layout mais limpo e organizado."]
    ]
  }
];

const DICT = {
  "PERFORMANCE": {en:"PERFORMANCE", es:"RENDIMIENTO"},
  "INTERFACE": {en:"INTERFACE", es:"INTERFAZ"},

  "Site otimizado": {
    en:"Site optimized",
    es:"Sitio optimizado"
  },
  "Reduzimos efeitos pesados para evitar lag.": {
    en:"Heavy effects reduced to prevent lag.",
    es:"Se redujeron efectos pesados para evitar lag."
  },
  "Nova tela inicial": {
    en:"New start screen",
    es:"Nueva pantalla inicial"
  },
  "Layout mais limpo e organizado.": {
    en:"Cleaner and organized layout",
    es:"Diseño más limpio y organizado"
  }
};

function t(text, lang){
  if(lang === "pt") return text;
  return DICT[text]?.[lang] || text;
}

function renderLog(lang="pt"){
  document.getElementById("logContent").innerHTML =
    UPDATE_LOG_PT.map(sec => `
      <div class="log-block">
        <h3>${t(sec.title, lang)}</h3>
        <ul>
          ${sec.items.map(i => `
            <li>${t(i[0], lang)}<span class="log-sub">${t(i[1], lang)}</span></li>
          `).join("")}
        </ul>
      </div>
    `).join("");
}

function openUpdateLog(){
  renderLog("pt");
  document.getElementById("updateModal").classList.add("show");
}

function closeUpdateLog(){
  document.getElementById("updateModal").classList.remove("show");
}

function goTo(page){
  window.location.href = page;
}
</script>

</body>
</html>
